name: 063-066_p2p-p2m-txn-volume-value

on:
  schedule:
    - cron: '30 3 1-10 * *'   # Daily 1st-10th at 9:00 AM IST (03:30 UTC)

  workflow_dispatch:

concurrency:
  group: 063-066_p2p-p2m-txn-volume-value
  cancel-in-progress: false

jobs:
  p2p-p2m-txn-volume-value:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager supabase

      - name: Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd Agents
          python 063-066_p2p-p2m-txn-volume-value.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-p2m-txn-volume-value-step-screenshots
          path: Agents/step*.png
