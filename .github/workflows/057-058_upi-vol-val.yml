name: 057-058_upi-vol-val

on:
  schedule:
    - cron: '30 2 1-5 * *'   # daily 1st-5th at 8:00 AM IST
  
  workflow_dispatch:

concurrency:
  group: 057-058_upi-vol-val
  cancel-in-progress: false

jobs:
  upi-vol-val:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager supabase

      - name: Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd Agents
          python 057-058_upi-vol-val.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upi-vol-val-step-screenshots
          path: Agents/step*.png
