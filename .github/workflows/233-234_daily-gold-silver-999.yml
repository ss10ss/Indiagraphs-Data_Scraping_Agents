name: 233-234_daily-gold-silver-999

on:
  schedule:
    - cron: '30 12 * * *' # Runs daily at 9:00 AM IST (03:30 UTC)
  workflow_dispatch:

jobs:
  daily-gold-silver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium supabase

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install webdriver-manager

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd Agents
          python 233-234_daily-gold-silver-999.py

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: Agents/error_screenshot_attempt_*.png

      - name: Upload screenshot on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: success-screenshot
          path: Agents/screenshot_*.png
